# Build and publish the Frametop image (pack/Containerfile). Native arm64
# runner: the Frame is aarch64, and cross-building would double the build time.
# Actions are pinned to commit SHAs (the version each SHA corresponds to is in
# the comment); dependabot-style bumps change the SHA deliberately.
name: image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "pack/**"
      - "screens/**"
      - "pointer/**"
      - "gaze/**"
      - "power/**"
      - "session/**"
      - "input/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "justfile"
      - "ft"
      - ".github/workflows/image.yml"
      - "!**.md"
      - "!**/DESIGN.md"
  workflow_dispatch:
    inputs:
      runner:
        description: "where to run (cloud arm64, or the local ft-arm64 runner via scripts/gh-runner.sh)"
        type: choice
        default: cloud
        options: [cloud, local]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ${{ inputs.runner == 'local' && fromJSON('["self-hosted", "ft-arm64"]') || fromJSON('["ubuntu-24.04-arm"]') }}
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # docker/setup-buildx-action@v4.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      # docker/login-action@v4.6.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # docker/metadata-action@v6.2.0
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # docker/build-push-action@v7.4.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: .
          file: pack/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
    outputs:
      tag: ${{ steps.meta.outputs.version }}

  smoke:
    needs: build
    runs-on: ${{ inputs.runner == 'local' && fromJSON('["self-hosted", "ft-arm64"]') || fromJSON('["ubuntu-24.04-arm"]') }}
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The suites run with just, inside the built image (see justfile). The tag
      # is the one the build pushed: metadata-action's version output (the
      # sanitized branch name, or the semver tag).
      - name: Run the Python suites inside the built image
        run: |
          docker run --rm \
            -v "$PWD":/src/frametop --workdir /src/frametop \
            "${IMAGE}:${{ needs.build.outputs.tag }}" just test
      # The wrapper is the counterpart of the image: every run on a device
      # goes through it, so a wrapper change can break a working image just
      # like an image change can. The smoke job therefore exercises the
      # wrapper itself, against the image this run built.
      - name: Exercise the ft wrapper against the built image
        run: |
          export FT_IMAGE="${IMAGE}:${{ needs.build.outputs.tag }}"
          # repo mode: a program runs from the image, with the checkout mounted
          ./ft python -V
          # installed mode, in a sandbox: update digest-pins, then runs.
          # FT_IMAGE must go: it is the explicit user override and would
          # shadow the pin this section is meant to test.
          unset FT_IMAGE
          mkdir -p /tmp/ft-home/.config/frametop /tmp/ft-home/bin
          echo "$FT_IMAGE" > /tmp/ft-home/.config/frametop/published
          install ./ft /tmp/ft-home/bin/ft
          FT_IMAGE_PUBLISHED="$FT_IMAGE" XDG_CONFIG_HOME=/tmp/ft-home/.config \
            /tmp/ft-home/bin/ft update
          pinned=$(cat /tmp/ft-home/.config/frametop/image)
          grep -q '@sha256:' <<<"$pinned" || { echo "no digest pinned: $pinned"; exit 1; }
          XDG_CONFIG_HOME=/tmp/ft-home/.config /tmp/ft-home/bin/ft python -V
          # the image carries this run's wrapper, so the self-refresh keeps
          # wrapper and image identical
          cmp /tmp/ft-home/bin/ft ./ft || { echo "wrapper in image diverged"; exit 1; }
          # :latest is refused for what gets deployed
          echo "${IMAGE}:latest" > /tmp/ft-home/.config/frametop/image
          XDG_CONFIG_HOME=/tmp/ft-home/.config /tmp/ft-home/bin/ft python -V && exit 1 || true
